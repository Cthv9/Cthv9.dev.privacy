<!doctype html>
<html lang="%%LANG%%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>%%TITLE%%</title>
  <meta name="description" content="%%DESCRIPTION%%">
  <meta name="color-scheme" content="light dark">
  <style>
    :root {
      --bg: #ffffff;
      --text: #1d2327;
      --muted: #5b6770;
      --line: #d8dee3;
      --accent: #0b5cad;
      --head: #f3f6f9;
      --mark: #fff1b8;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #14181c;
        --text: #e6eaed;
        --muted: #9aa6af;
        --line: #2c353c;
        --accent: #6db3f2;
        --head: #1c2227;
        --mark: #5a4a00;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 16px 3rem; }
    nav.top { max-width: 46rem; margin: 0 auto; padding: 1rem 16px 0; font-size: .9rem; }
    h1 { font-size: 1.75rem; line-height: 1.25; margin: .5rem 0 1rem; }
    h2 { font-size: 1.25rem; margin: 2.2rem 0 .6rem; padding-top: .4rem; border-top: 1px solid var(--line); }
    h3 { font-size: 1.05rem; margin: 1.5rem 0 .4rem; }
    a { color: var(--accent); }
    ul, ol { padding-left: 1.4rem; }
    li { margin: .25rem 0; }
    blockquote { margin: 1rem 0; padding: .1rem 1rem; border-left: 3px solid var(--line); color: var(--muted); }
    hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
    mark { background: var(--mark); color: inherit; padding: 0 .2em; }
    .muted { color: var(--muted); font-size: .92rem; }
    .table-wrap { overflow-x: auto; margin: 1rem 0; }
    table { border-collapse: collapse; width: 100%; font-size: .93rem; }
    th, td { border: 1px solid var(--line); padding: .45rem .65rem; text-align: left; vertical-align: top; }
    th { background: var(--head); }
    ul.apps { list-style: none; padding: 0; }
    ul.apps li { padding: .8rem 0; border-bottom: 1px solid var(--line); }
    @media print {
      nav.top { display: none; }
      body { font-size: 11pt; }
      a { color: inherit; }
    }
  </style>
</head>
<body>
  <nav class="top"><a href="%%HOME%%">&larr; Tutte le informative</a></nav>
  <main>
%%CONTENT%%
  </main>
</body>
</html>
